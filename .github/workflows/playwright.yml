name: Playwright Tests CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci || npm install

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright Tests
      env:
        BASE_URL: ${{ secrets.BASE_URL || 'http://sign.test-zentixs.com/' }}
        USER_EMAIL: ${{ secrets.USER_EMAIL }}
        USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
      run: |
        if [ -z "$USER_EMAIL" ] || [ -z "$USER_PASSWORD" ]; then
          echo "⚠️ Credentials missing in environment. Running API tests only to prevent pipeline blockage."
          npm run test:api
        else
          echo "🚀 Running all tests (API, Smoke, Regression)..."
          npm run test
        fi

    - name: Upload Playwright HTML Report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 14
